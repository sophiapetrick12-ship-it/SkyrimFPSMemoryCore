name: One-time source formatting repair

on:
  push:
    branches:
      - feature/frame-monitor-validation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/frame-monitor-validation
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install clang-format 22
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-22
      - name: Format C++ sources
        run: clang-format-22 -i src/*.cpp src/*.h
      - name: Commit formatted sources and remove this temporary workflow
        run: |
          git rm .github/workflows/format-fix.yml
          git add src
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format implementation with clang-format"
          git push origin HEAD:feature/frame-monitor-validation
